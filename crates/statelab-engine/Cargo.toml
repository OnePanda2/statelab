[package]
name = "statelab-engine"
version = "1.0.0"
description = "StateLab generic deterministic state-evolution engine (pure Rust, zero Tauri dependency)."
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

[dev-dependencies]
# Property-based testing (§7.3). Default features (fork/timeout) are dropped so we
# only pull the core property engine.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Benchmarking (§7.7). Default features (plotters/rayon/html_reports) are dropped
# to keep the dependency surface small; plain-text bench output is enough.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
